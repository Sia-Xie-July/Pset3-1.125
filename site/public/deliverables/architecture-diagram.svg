<text x="60" y="699" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Answer + citations</text>
<text x="60" y="724" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Assumptions + calculations</text>
<text x="60" y="749" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Decisions + uncertainties</text>
