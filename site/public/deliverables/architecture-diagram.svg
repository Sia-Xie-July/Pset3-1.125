<text x="350" y="1017" fill="#965D19" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">If retrieval or validation fails: retain last valid observations and record a visible failure.</text>
<rect x="40" y="1052" width="1240" height="74" rx="10" fill="#E7EEF5" stroke="#E7EEF5"/>
<text x="60" y="1081" fill="#285AA5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SERVER BOUNDARY</text>
<text x="254" y="1081" fill="#172D49" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">API keys stay server-side. Browsers and models have no direct D1 access.</text>
<text x="60" y="1111" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Retrieved text and history are untrusted evidence. Valid citations do not guarantee a complete or correct answer.</text>
<text x="40" y="1148" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Assignment Steps 14, 16-24 and 26  |  Application architecture; physical datacenter design is a separate diagram.</text>
