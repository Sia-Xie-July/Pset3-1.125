<text x="40" y="88" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700">Website and AI architecture</text>
<text x="40" y="121" fill="#D5E2EF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">Current application flow  /  Evidence in D1  /  Server-controlled access and tools</text>
