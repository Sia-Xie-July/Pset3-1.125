<text x="104" y="267" fill="#172D49" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Ask a question</text>
<text x="60" y="301" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Question + bounded history</text>
<text x="60" y="326" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Public pages need no login.</text>
<text x="60" y="351" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Adviser requires registration.</text>
<rect x="375" y="225" width="580" height="148" rx="14" fill="#FFFFFF" stroke="#CCD8E4"/>
<rect x="393" y="243" width="32" height="32" rx="9" fill="#285AA5" stroke="#285AA5"/>
<text x="402" y="266" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">2</text>
<text x="439" y="267" fill="#172D49" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Check access</text>
<text x="395" y="301" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Trusted platform identity + D1 users / roles</text>
<text x="395" y="326" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Validate origin and request; reserve rate-limit slot.</text>
<text x="395" y="351" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Anonymous 401  /  unregistered 403  /  limit 429</text>
