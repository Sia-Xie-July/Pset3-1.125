<text x="439" y="693" fill="#172D49" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Return a sourced answer</text>
<text x="395" y="727" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Render classifications and real D1 source links.</text>
<text x="395" y="752" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Unmatched citations get an advisory warning.</text>
<text x="395" y="777" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Record token usage and request outcome.</text>
