<text x="402" y="467" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">3</text>
<text x="439" y="468" fill="#172D49" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Retrieve and reason</text>
<text x="395" y="502" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Load current design, relevant claims and real sources.</text>
<text x="395" y="527" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Server executes allowlisted tools for the model:</text>
<text x="395" y="552" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">D1 lookups, energy and financial calculations,</text>
<text x="395" y="577" fill="#50657B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">or an approved API read with saved-data fallback.</text>
